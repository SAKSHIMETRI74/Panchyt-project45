{% extends "base.html" %}
{% block content %}
<section class="card narrow center">
  <h1>{{ code }}</h1>
  <h2>{{ t('err_404_title') if code == 404 else t('err_title') }}</h2>
  <p class="muted">{{ t('err_404_desc') if code == 404 else name }}</p>
  <a class="btn btn-primary" href="{{ url_for('index') }}">{{ t('back_home') }}</a>
</section>
{% endblock %}
