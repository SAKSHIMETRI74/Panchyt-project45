{% extends "base.html" %}
{% block title %}{{ t('admin_login_title') }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>🏛️ {{ t('admin_login_title') }}</h1>
  <p class="muted">{{ t('admin_login_subtitle') }}</p>
  <form id="loginForm" autocomplete="on">
    <label>{{ t('lbl_phone') }}
      <input name="phone" type="tel" inputmode="numeric" maxlength="14" required autocomplete="username">
    </label>
    <label>{{ t('lbl_password') }}
      <input name="password" type="password" required autocomplete="current-password">
    </label>
    <input type="hidden" name="portal" value="admin">
    <button class="btn btn-dark btn-block" type="submit">{{ t('btn_admin_login') }}</button>
  </form>
  <p class="muted small">{{ t('admin_login_note') }}</p>
</section>
{% endblock %}
