services:
  - type: web
    name: panchayat-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60 --preload
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false          # you type this in the Render dashboard
      - key: SEED_DEMO_DATA
        value: "1"           # set to 0 for a real launch (no sample complaints)
      - key: SMS_GATEWAY_PROVIDER
        value: mock          # change to fast2sms + FAST2SMS_API_KEY for real SMS
      - key: HELPLINE_NUMBER
        sync: false
